  <body>
    <header class="hero-section">
      <!-- Nav-bar Started -->
      <nav class="navbar">
        <div class="logo">
          <img
            src="./Resources/Icons & Logo/Main Logo - Copy.png"
            alt="Main-Logo"
            id="icon-logo"
          />
          <h1 id="brand-name">Bemet</h1>
        </div>
        <div class="link-bundle">
          <a href="" class="n-link">HOME</a>
          <a href="" class="n-link">PRODUCTS</a>
          <a href="" class="n-link">ABOUT US</a>
          <a href="" class="n-link">HELP</a>
          <a href="" class="n-link">BLOG</a>
        </div>
        <div class="icon-button">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-cart-shopping"></i>
          <button class="r-btn">Contact Us</button>
        </div>
      </nav>
      <!-- Nav-bar ended -->
      <img
        src="./Resources/Hero Section/Section.png"
        alt="hero-bg"
        class="hero-bg"
      />
      <div class="hero-container">
        <div class="hero-txt">
          <div class="title-box">
            <h1>Fresh Meat</h1>
            <h3>Butcher & Meat shop</h3>
          </div>
          <button class="r-btn">ORDER NOW</button>
        </div>
        <div class="hero-img-container">
          <div class="himg-sub-container c-01">
            <img src="./Resources/Hero Section/shape03.png.png" alt="" class="hero-img-sub sub-1">
            <img
              src="./Resources/Hero Section/shape02.png"
              alt="Gusto-s1"
              width=" 100%"
              class="hero-img-sub sub-3"
            />
            
          </div>

          <img
            src="./Resources/Hero Section/Image.png"
            alt="Gusto2"
            class="hero-img"
          />
          <div class="himg-sub-container c-02">
            <img src="./Resources/Hero Section/shape04.png" alt="" class="hero-img-sub sub-2">
            <img
              src="./Resources/Hero Section/shape01.png"
              alt="Gusto-s2"
              class="hero-img-sub sub-4"
            />
          </div>
        </div>
      </div>
    </header>
